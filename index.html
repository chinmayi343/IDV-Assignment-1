<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore PSI Readings</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        #status {
            text-align: center;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <h1>Singapore PSI Readings</h1>

    <p id="status">Loading data...</p>

    <table>
        <thead>
            <tr>
                <th>Reading</th>
                <th>Value</th>
            </tr>
        </thead>

        <tbody id="psiTable">
        </tbody>
    </table>

    <script>
        const API_URL =
            "https://api-open.data.gov.sg/v2/real-time/api/psi";

        async function getPSIData() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Unable to load data");
                }

                const data = await response.json();

                console.log(data);

                const readings = data.data.items[0].readings;

                const table = document.getElementById("psiTable");

                for (const [name, value] of Object.entries(readings)) {
                    const row = document.createElement("tr");

                    const readingCell = document.createElement("td");
                    readingCell.textContent = name;

                    const valueCell = document.createElement("td");
                    valueCell.textContent = value;

                    row.appendChild(readingCell);
                    row.appendChild(valueCell);

                    table.appendChild(row);
                }

                document.getElementById("status").textContent =
                    "Realtime PSI data loaded successfully.";

            } catch (error) {
                console.error(error);

                document.getElementById("status").textContent =
                    "Unable to load data.";
            }
        }

        getPSIData();
    </script>

</body>
</html>
